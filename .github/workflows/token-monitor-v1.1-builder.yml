name: Token Monitor v1.1 Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: token-monitor-linux-x86_64
            binary: token-monitor
          - label: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: token-monitor-linux-aarch64
            binary: token-monitor
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            asset: token-monitor-macos-aarch64
            binary: token-monitor
          - label: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            asset: token-monitor-macos-x86_64
            binary: token-monitor
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: token-monitor-windows-x86_64
            binary: token-monitor.exe
          - label: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: token-monitor-windows-aarch64
            binary: token-monitor.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Token Monitor
        uses: actions/checkout@v4
        with:
          repository: Atingaii/token-monitor
          ref: main
          path: token-monitor
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Configure musl
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ '${{ matrix.target }}' = 'x86_64-unknown-linux-musl' ]; then
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
            echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
          else
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
            echo 'CC_aarch64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
          fi
      - name: Unit tests
        working-directory: token-monitor
        run: cargo test --workspace --all-targets --target ${{ matrix.target }}
      - name: Release build
        working-directory: token-monitor
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Verify Unix binary
        if: runner.os != 'Windows'
        shell: bash
        working-directory: token-monitor
        run: |
          binary='target/${{ matrix.target }}/release/${{ matrix.binary }}'
          "$binary" --version | grep '1.1.0'
          "$binary" clients >/dev/null
          if [ '${{ runner.os }}' = 'Linux' ]; then
            file "$binary"
            ! readelf -l "$binary" | grep -q 'Requesting program interpreter'
            ! strings "$binary" | grep -q 'GLIBC_[0-9]'
          fi
      - name: Verify Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: token-monitor
        run: |
          $binary = 'target/${{ matrix.target }}/release/${{ matrix.binary }}'
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '1\.1\.0') { throw "Unexpected version: $version" }
          & $binary clients | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'clients smoke test failed' }
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        working-directory: token-monitor
        run: |
          mkdir -p out/package
          cp 'target/${{ matrix.target }}/release/${{ matrix.binary }}' out/package/token-monitor
          chmod +x out/package/token-monitor
          tar -C out/package -czf 'out/${{ matrix.asset }}.tar.gz' token-monitor
          cd out
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum '${{ matrix.asset }}.tar.gz' > '${{ matrix.asset }}.sha256'
          else
            shasum -a 256 '${{ matrix.asset }}.tar.gz' > '${{ matrix.asset }}.sha256'
          fi
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: token-monitor
        run: |
          New-Item -ItemType Directory -Force out/package | Out-Null
          Copy-Item 'target/${{ matrix.target }}/release/${{ matrix.binary }}' 'out/package/token-monitor.exe'
          Compress-Archive -Force 'out/package/token-monitor.exe' 'out/${{ matrix.asset }}.zip'
          $hash = (Get-FileHash 'out/${{ matrix.asset }}.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.asset }}.zip" | Set-Content -NoNewline 'out/${{ matrix.asset }}.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: token-monitor/out/${{ matrix.asset }}.*
          if-no-files-found: error
          retention-days: 1
